name: firmware
on:
  push:
    tags: ['fw-v*']
  pull_request:
    paths: ['firmware/**', 'docs/COMPAT.md']
jobs:
  compat-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 firmware/ci/compat_gate.py docs/COMPAT.md
  build:
    needs: compat-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hwrev: ${{ fromJson(needs.compat-gate.outputs.hwrevs || '["hw-revA"]') }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO CELL-002: ImageBuilder for ${{ matrix.hwrev }}"
      - run: echo "TODO CELL-002: sign with usign key from secrets"
      - uses: actions/upload-artifact@v4
        with: { name: 'fw-${{ matrix.hwrev }}', path: firmware/out/ }
